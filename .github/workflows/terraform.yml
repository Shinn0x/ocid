name: terraform

on:
  push:
    branches: [main]
    paths:
      - "**.tf"
      - ".github/workflows/terraform.yml"

permissions:
  id-token: write # needed to request the GitHub OIDC token that AWS STS exchanges for credentials
  contents: read

# Shared with destroy.yml so an apply and a destroy can never run at the same time.
# cancel-in-progress: false queues the new run instead of killing an apply halfway through.
concurrency:
  group: terraform-ocid
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    # No `environment:` on purpose: it would change the OIDC subject to
    # repo:alex/ocid:environment:<name>, which the role's trust policy rejects.
    steps:
      - uses: actions/checkout@v7

      # Temporary: prints the claims AWS checks against the trust policy. Only the decoded
      # payload is printed, never the token itself. Remove once OIDC works.
      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2 | tr '_-' '/+')
          # JWTs strip base64 padding; without re-adding it, base64 -d can truncate and jq fails.
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          echo "$PAYLOAD" | base64 -d | jq '{sub, aud, repository, ref, event_name}'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1
          # Fail fast: the default retries hide the real STS error behind ~2 minutes of backoff.
          retry-max-attempts: 1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "^1.10.0"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      # Applying the saved plan guarantees exactly what was planned gets applied.
      - name: Terraform apply
        run: terraform apply -input=false tfplan
