name: destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to delete all resources'
        required: true
        type: string

permissions:
  id-token: write # needed to request the GitHub OIDC token that AWS STS exchanges for credentials
  contents: read

# Same group as terraform.yml so destroy never overlaps an apply.
concurrency:
  group: terraform-ocid
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      # Checked first so a typo fails before any AWS credentials are issued.
      # The input is passed via env, not inlined, to avoid shell injection.
      - name: Check confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "destroy" ]; then
            echo "::error::Confirmation input must be exactly 'destroy'."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "^1.10.0"

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform destroy
        run: terraform destroy -input=false -auto-approve
